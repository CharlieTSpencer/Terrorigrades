<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terrorigrades</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
</style>
</head>
<body>
<canvas id="c" width="384" height="216"></canvas>
<script>
// =====================================================================
//  EKRAN 16-BIT  (384x216, skalowanie całkowite – 1920x1080 = x5)
// =====================================================================
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const W = 384, H = 216, HUD = 14;
const GROUND_TOP = 104, GROUND_BOT = 212;     // zakres "stóp" (głębia sceny)
const LANE = 18;                               // tolerancja głębi przy trafieniach
ctx.imageSmoothingEnabled = false;
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();
const FONT = '"Press Start 2P", monospace';
try { document.fonts.load('8px "Press Start 2P"', 'ĄĆĘŁŃÓŚŹŻąćęłńóśźż—„”…°•'); } catch (e) {}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// =====================================================================
//  GENERATOR PIKSELI (cieniowanie rampami kolorów + dithering)
// =====================================================================
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise2(seed) {
  const R = rng(seed), g = new Float32Array(64 * 64);
  for (let i = 0; i < g.length; i++) g[i] = R();
  const at = (i, j) => g[((j & 63) * 64) + (i & 63)];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
    const a = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * sx;
    const b = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * sx;
    return a + (b - a) * sy;
  };
}
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]].map(r => r.map(v => (v + 0.5) / 16));
function pick(ramp, v, x, y) {
  v = clamp(v, 0, 0.999) * (ramp.length - 1);
  let i = Math.floor(v);
  if (v - i > BAYER[y & 3][x & 3]) i++;
  return ramp[Math.min(i, ramp.length - 1)];
}
const LL = Math.hypot(0.5, 0.7, 0.6), LX = -0.5 / LL, LY = -0.7 / LL, LZ = 0.6 / LL;   // światło z lewej-góry

const rgbCache = {};
const rgb = h => rgbCache[h] || (rgbCache[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
class Buf {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  set(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = c; }
  get(x, y) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null; return this.d[y * this.w + x]; }
  outline(col) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y)) continue;
      if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) add.push(x, y);
    }
    for (let i = 0; i < add.length; i += 2) this.set(add[i], add[i + 1], col);
  }
  toCanvas() {
    const c = document.createElement('canvas'); c.width = this.w; c.height = this.h;
    const g = c.getContext('2d'), id = g.createImageData(this.w, this.h);
    for (let i = 0; i < this.d.length; i++) {
      const h = this.d[i]; if (!h) continue;
      const [R, G, B] = rgb(h);
      id.data[i * 4] = R; id.data[i * 4 + 1] = G; id.data[i * 4 + 2] = B; id.data[i * 4 + 3] = 255;
    }
    g.putImageData(id, 0, 0);
    return c;
  }
}
// cieniowana elipsoida; sep = linia tam, gdzie zachodzi na wcześniej narysowaną część
function ellipsoid(b, cx, cy, rx, ry, ramp, o = {}) {
  const t = 1 - 1.3 / Math.min(rx, ry), sepD = t * t;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry, d = nx * nx + ny * ny;
      if (d > 1) continue;
      if (o.sep && d > sepD && b.get(x, y)) { b.set(x, y, o.sepC || ramp[0]); continue; }
      const nz = Math.sqrt(1 - d);
      const v = (nx * LX + ny * LY + nz * LZ) * 0.7 + 0.35 + (o.bias || 0);
      b.set(x, y, pick(ramp, v, x, y));
    }
}
function tint(c, col) {
  const n = document.createElement('canvas'); n.width = c.width; n.height = c.height;
  const g = n.getContext('2d'); g.drawImage(c, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = col; g.fillRect(0, 0, n.width, n.height);
  return n;
}

// =====================================================================
//  PALETY
// =====================================================================
const TR = ['#3a2618', '#5a3e28', '#7e5c3e', '#a07c56', '#bc9a70', '#d4b68a', '#e6cfa6', '#f4e6c6'];   // niesporczak
const TR_FAR = ['#24180e', '#382618', '#4e3624', '#644832', '#7a5a40'];
const M     = ['#1b1d23', '#2e323b', '#474d58', '#666e7b', '#8e96a3', '#bcc3cd', '#e6eaf0'];  // metal
const BODY  = ['#3e3a36', '#625c56', '#8c857c', '#b5ada2', '#d6cfc4', '#efe9e0', '#fbf8f2'];  // biały kadłub
const GOLD  = ['#4a3010', '#7a5418', '#b08028', '#d8a840', '#f4d070'];                       // folia izolacyjna
const RTGC  = ['#141414', '#24262a', '#383c42', '#50555c', '#6a7078'];                       // generator RTG
const GLASS = ['#05080c', '#0e1a26', '#24405a', '#5a90b8'];
const LINE_R = '#1c1814';   // kontur łazika
const LINE_T = '#4a3422';   // kontur niesporczaka

// =====================================================================
//  ŁAZIK MARSJAŃSKI (6 kół, wahacze rocker-bogie, maszt z głowicą,
//  generator RTG, antena talerzowa, ramię z wiertłem) – składany z części
// =====================================================================
const RW = 48, RH = 46;
const WHEEL_N = 8;
function buildWheel(fr) {
  const b = new Buf(13, 13), cx = 6.5, cy = 6.5, R = 5.5, rot = fr * (Math.PI / 3) / WHEEL_N;
  for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.hypot(dx, dy);
    if (d > R) continue;
    const a = Math.atan2(dy, dx) - rot;
    let c;
    if (d > R - 1.6) {                     // opona z grouserami
      const g = ((a / (Math.PI / 6)) % 1 + 1) % 1 < 0.4;
      c = pick(M, 0.62 - (dx + dy) / R * 0.25 - (g ? 0.4 : 0), x, y);
    } else if (d < 1.5) c = d < 0.8 ? M[2] : M[5];   // piasta
    else {                                 // zakrzywione szprychy
      const sa = a + (d / R) * 0.9, sp = ((sa / (Math.PI / 3)) % 1 + 1) % 1;
      c = sp < 0.22 ? pick(M, 0.72 - (dx + dy) / R * 0.2, x, y) : pick(['#0e0c0a', '#1e1a16', '#2c2620'], 0.3 + d / R * 0.5, x, y);
    }
    b.set(x, y, c);
  }
  b.outline('#141210');
  return b.toCanvas();
}
const WHEEL = Array.from({ length: WHEEL_N }, (_, i) => buildWheel(i));
const WHEEL_FAR = WHEEL.map(c => tint(c, 'rgba(30,14,6,0.5)'));

function buildChassis() {
  const b = new Buf(RW, RH);
  // generator RTG z żebrami (z tyłu, skośnie w górę)
  const p0 = [10, 22], p1 = [2, 12], ax = p1[0] - p0[0], ay = p1[1] - p0[1], Lr = Math.hypot(ax, ay), pxv = -ay / Lr, pyv = ax / Lr;
  for (let s = 0; s <= 1; s += 0.03) {
    const cx = p0[0] + ax * s, cy = p0[1] + ay * s, fin = Math.floor(s * 12) % 2 === 0, wmax = fin ? 3.5 : 2.5;
    for (let w = -wmax; w <= wmax; w += 0.5) {
      const x = cx + pxv * w, y = cy + pyv * w;
      let col = pick(RTGC, 0.55 - (w / 3) * 0.35 + (fin ? 0.15 : -0.1), Math.floor(x), Math.floor(y));
      if (Math.abs(w) > 2.6) col = RTGC[3];
      b.set(x, y, col);
    }
  }
  // kadłub
  for (let y = 19; y <= 28; y++) for (let x = 8; x <= 38; x++) {
    let c;
    if (y >= 26) c = pick(GOLD, 0.65 - (y - 26) * 0.2 + ((x + y) % 7 === 0 ? 0.3 : 0) - (x >= 36 ? 0.2 : 0), x, y);
    else {
      let v = 0.62;
      if (y === 19) v = 0.95; else if (y === 20) v = 0.8;
      if (x <= 9) v += 0.1;
      if (x >= 36) v -= 0.18;
      if (y === 25) v -= 0.15;
      c = pick(BODY, v, x, y);
      if ((x === 17 || x === 28) && y > 19) c = BODY[2];
    }
    b.set(x, y, c);
  }
  for (let x = 20; x <= 25; x += 2) b.set(x, 22, BODY[1]);
  for (let x = 20; x <= 25; x += 2) b.set(x, 23, BODY[2]);
  for (const [x, y] of [[10, 21], [35, 21], [10, 24], [35, 24]]) { b.set(x, y, BODY[6]); b.set(x, y + 1, BODY[1]); }
  // pokład
  for (let x = 6; x <= 41; x++) { b.set(x, 17, x > 38 ? BODY[3] : BODY[5]); b.set(x, 18, BODY[2]); }
  // skrzynka sprzętu
  for (let y = 13; y <= 16; y++) for (let x = 9; x <= 16; x++) b.set(x, y, pick(BODY, y === 13 ? 0.9 : (x === 16 ? 0.35 : 0.6), x, y));
  b.set(11, 15, BODY[1]); b.set(12, 15, BODY[1]); b.set(14, 15, '#3aa860');
  // moduł owinięty złotą folią
  for (let y = 14; y <= 16; y++) for (let x = 18; x <= 23; x++) b.set(x, y, pick(GOLD, (y === 14 ? 0.85 : 0.5) + ((x * 3 + y) % 5 === 0 ? 0.25 : 0), x, y));
  // antena talerzowa (HGA)
  for (let y = 12; y <= 16; y++) b.set(27, y, M[3]);
  ellipsoid(b, 27.5, 10.5, 4.6, 1.9, M.slice(2));
  b.set(27, 10, M[2]); b.set(28, 10, M[2]);
  // antena prętowa (LGA)
  for (let y = 7; y <= 12; y++) b.set(14, y, M[4]);
  ellipsoid(b, 14.5, 6.5, 1.4, 1.3, M.slice(3));
  // podstawa masztu
  for (let y = 14; y <= 16; y++) for (let x = 32; x <= 37; x++) b.set(x, y, pick(M, y === 14 ? 0.85 : 0.45, x, y));
  b.outline(LINE_R);
  return b.toCanvas();
}
const CHASSIS = buildChassis();

// głowica masztu (kamery + duża soczewka lasera); pan = obrót w stronę widza
function buildHead(pan) {
  const b = new Buf(14, 10);
  const fw = 2 + pan * 3, x0 = 1, x1 = 12, y0 = 2, y1 = 8, fx0 = x1 - fw + 1;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    let v = x >= fx0 ? 0.72 - (y - y0) * 0.04 : 0.5 - (y - y0) * 0.05;
    if (y === y0) v = 0.95;
    if (y === y1) v -= 0.25;
    b.set(x, y, pick(BODY, v, x, y));
  }
  if (fw < 11) for (let y = y0 + 1; y <= y1; y++) b.set(fx0 - 1, y, BODY[2]);
  for (let x = x0 + 1; x < fx0 - 2; x++) b.set(x, 5, BODY[2]);
  const lcx = fx0 + fw / 2, rx = Math.max(0.6, Math.min(1.9, fw / 2 - 0.3));
  for (let y = 3; y <= 6; y++) for (let x = fx0; x <= x1; x++) {
    const nx = (x + 0.5 - lcx) / rx, ny = (y + 0.5 - 4.6) / 1.9;
    if (nx * nx + ny * ny <= 1) b.set(x, y, pick(GLASS, 0.25 + ny * 0.3, x, y));
  }
  b.set(Math.floor(lcx - 0.5), 4, '#9ac8ec');
  if (fw >= 5) { b.set(Math.floor(lcx - 2), 7, GLASS[0]); b.set(Math.floor(lcx + 1), 7, GLASS[0]); }
  b.outline(LINE_R);
  return b.toCanvas();
}
const HEAD = [0, 1, 2].map(buildHead);

// składanie łazika w osobnym płótnie (potem odbijane w poziomie)
const RC = document.createElement('canvas'); RC.width = RW; RC.height = RH;
const rg = RC.getContext('2d');
const WX = [8, 24, 40], WY = 38;
function linePts(x0, y0, x1, y1) {
  const pts = [], dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, x = x0, y = y0;
  for (let n = 0; n < 300; n++) {
    pts.push([x, y]);
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x += sx; }
    if (e2 <= dx) { err += dx; y += sy; }
  }
  return pts;
}
function drawLinks(g, segs, hi = M[5], lo = M[3]) {
  const all = segs.map(([a, b]) => linePts(Math.round(a[0]), Math.round(a[1]), Math.round(b[0]), Math.round(b[1])));
  g.fillStyle = LINE_R;
  for (const pts of all) for (const [x, y] of pts) g.fillRect(x - 1, y - 1, 4, 4);
  for (const pts of all) for (const [x, y] of pts) { g.fillStyle = hi; g.fillRect(x, y, 2, 1); g.fillStyle = lo; g.fillRect(x, y + 1, 2, 1); }
}
function joint(g, x, y, r = 2) {
  g.fillStyle = LINE_R; g.fillRect(x - r, y - r, r * 2 + 1, r * 2 + 1);
  g.fillStyle = M[5]; g.fillRect(x - r + 1, y - r + 1, r * 2 - 1, r * 2 - 1);
  g.fillStyle = M[2]; g.fillRect(x, y, 1, 1);
}
function composeRover(o, bodyOff, wf, pan) {
  rg.clearRect(0, 0, RW, RH);
  for (let i = 0; i < 3; i++) rg.drawImage(WHEEL_FAR[(wf + 3) % WHEEL_N], WX[i] - 6 + 3, WY + o[(i + 1) % 3] - 6 - 2);
  rg.drawImage(CHASSIS, 0, bodyOff);
  for (let y = 9 + bodyOff; y <= 16 + bodyOff; y++) {
    rg.fillStyle = LINE_R; rg.fillRect(33, y, 4, 1);
    rg.fillStyle = M[5]; rg.fillRect(34, y, 1, 1);
    rg.fillStyle = M[3]; rg.fillRect(35, y, 1, 1);
  }
  rg.drawImage(HEAD[pan], 29, bodyOff);
  const w = [0, 1, 2].map(i => [WX[i], WY + o[i]]);
  const piv = [30, 27 + bodyOff], bog = [16, 32 + Math.round((o[0] + o[1]) / 2)];
  drawLinks(rg, [[piv, w[2]], [piv, bog], [bog, w[0]], [bog, w[1]]]);
  joint(rg, piv[0], piv[1]); joint(rg, bog[0], bog[1]);
  for (let i = 0; i < 3; i++) rg.drawImage(WHEEL[wf], w[i][0] - 6, w[i][1] - 6);
}

// =====================================================================
//  NIESPORCZAK (realistyczny: półprzezroczysty, ryjek-rurka, 8 nóg
//  z pazurkami, chód falowy w 4 klatkach)
// =====================================================================
const TW = 102, TH = 64;
// ---- kremowy niesporczak: duża głowa, kolce, złe oczy ----
const PU = ['#3a2618', '#5a3e28', '#7e5c3e', '#a07c56', '#bc9a70', '#d4b68a', '#e6cfa6', '#f4e6c6', '#fff6e0'];
const PU_FAR = ['#24180e', '#382618', '#4e3624', '#644832', '#7a5a40'];
const LAVA = ['#1e140c', '#3a2618', '#5a3e28', '#8a6e52', '#b0946e', '#d4bc96'];   // akcenty (kolce, pazury)
const LINE_P = '#2a1a0e';
const isPU = c => PU.includes(c) || PU_FAR.includes(c);
function sparkle(b, x, y, big) {
  b.set(x, y, LAVA[5]);
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) b.set(x + dx, y + dy, LAVA[4]);
  if (big) for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) b.set(x + dx, y + dy, LAVA[3]);
}
// pazury – po trzy, pomarańczowe
function claws(b, x, y, far) {
  const c = far ? [LAVA[1], LAVA[0], LAVA[0]] : [LAVA[4], LAVA[3], LAVA[1]];
  for (const k of [-3, 0, 3]) { b.set(x + k, y, c[0]); b.set(x + k, y + 1, c[1]); b.set(x + k + 1, y + 2, c[2]); }
}
const LEG_OFF = [[2, 0], [0, 0], [-2, 0], [0, -2]];
function tardiR(x) {   // profil tułowia (bryła obrotowa); głowa rysowana osobno
  if (x < 4 || x > 76) return 0;
  let r = x < 20 ? 13.5 * Math.sqrt(Math.max(0, 1 - ((20 - x) / 16) ** 2)) : 13.5 + 2 * Math.sin(Math.PI * (x - 20) / 56);
  for (const bx of [26, 40, 54, 67]) r -= 1.1 * Math.exp(-((x - bx) ** 2) / 5);
  return Math.max(0, r);
}
const TARDI_YC = 32;
function tardiLeg(b, lx, ox, oy, ramp, top, bot, far) {
  bot += oy;
  for (let y = top; y <= bot; y++) {
    const k = (y - top) / (bot - top), cx = lx + ox * k, rad = 5.6 - k * k * 2.6;
    const cap = y > bot - 2 ? (y - (bot - 2)) * 0.9 : 0;
    for (let x = Math.floor(cx - rad); x <= Math.ceil(cx + rad); x++) {
      const nx = (x + 0.5 - cx) / (rad - cap);
      if (Math.abs(nx) > 1) continue;
      let v = (nx * LX + Math.sqrt(1 - nx * nx) * LZ) * 0.55 + 0.2 - k * 0.06;
      if (y - top === 4 || y - top === 9) v += 0.22;         // fałdy na nóżkach
      if (y === top && b.get(x, y)) { b.set(x, y, LAVA[1]); continue; }
      b.set(x, y, pick(ramp, v, x, y));
    }
  }
  claws(b, Math.round(lx + ox), bot + 1, far);
}
function buildTardi(legF, open) {
  const b = new Buf(TW, TH), vn = noise2(77);
  const LEGX = [20, 37, 54, 69], SPLAY = [-3, -1, 1, 2];
  const bob = [0, 0.4, 0, -0.4][legF];
  // dalsze nogi
  LEGX.forEach((lx, i) => { const [ox, oy] = LEG_OFF[(legF + i + 2) & 3]; tardiLeg(b, lx + 5, ox + SPLAY[i], oy, PU_FAR, 41, 55, true); });
  // tułów
  for (let x = 2; x <= 78; x++) {
    const rr = tardiR(x + 0.5);
    if (rr <= 0.5) continue;
    const yc = TARDI_YC + bob, s = clamp(tardiR(x + 1) - tardiR(x), -3, 3);
    for (let y = Math.floor(yc - rr); y <= Math.ceil(yc + rr); y++) {
      const ny = (y + 0.5 - yc) / rr;
      if (Math.abs(ny) > 1) continue;
      const nz = Math.sqrt(1 - ny * ny), len = Math.hypot(s, ny, nz);
      const dot = (-s * LX + ny * LY + nz * LZ) / len;
      let c = pick(PU, dot * 0.55 + 0.18 + (dot > 0.9 ? 0.15 : 0), x, y);
      for (const bx of [26, 40, 54, 67]) {                     // bruzdy między segmentami
        const arc = bx - 2.2 * ny * ny;
        if (Math.abs(x + 0.5 - arc) < 0.8) c = ny < 0.55 ? PU[1] : PU[0];
      }
      b.set(x, y, c);
    }
  }
  // głowa – duża i okrągła
  ellipsoid(b, 83, 31, 14, 14.5, PU, { sep: true, sepC: PU[1] });
  // drobna faktura skóry
  const R = rng(42);
  for (let i = 0; i < 80; i++) {
    const x = 6 + Math.floor(R() * 86), y = 16 + Math.floor(R() * 30);
    const k = PU.indexOf(b.get(x, y));
    if (k >= 3 && k <= 7) { b.set(x, y, PU[k + 1]); const k2 = PU.indexOf(b.get(x + 1, y + 1)); if (k2 >= 2) b.set(x + 1, y + 1, PU[k2 - 1]); }
  }
  // kolce na grzbiecie
  for (const sx of [24, 40, 56, 70]) {
    const top = Math.round(TARDI_YC - tardiR(sx) + bob);

const inBox = (px, py, b) => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
const bodyX0 = t => t.x + 4, bodyX1 = t => t.x + 98;
const lensY = () => roverTop() + 5 + r.bodyOff;

function armExt() {
  const a = r.armT;
  if (a <= 0) return 0;
  if (a <= 8) return a / 8;
  if (a <= 14) return 1;
  return Math.max(0, 1 - (a - 14) / 8);
}
const armTip = () => { const e = armExt(); return { x: rlx(r.x, r.face, 44 + 32 * e) + r.face * 5, y: roverTop() + 29 - 3 * e + r.bodyOff }; };

// =====================================================================
//  LOGIKA
// =====================================================================
function update() {
  frame++;
  for (const d of dust) { d.x -= d.s; if (d.x < 0) { d.x = W; d.y = Math.random() * H; } }

  if (state === 'menu') {
    if (hit('ArrowUp', 'KeyW')) { menuSel = (menuSel + 2) % 3; SFX.arm(); }
    if (hit('ArrowDown', 'KeyS')) { menuSel = (menuSel + 1) % 3; SFX.arm(); }
    if (hit('Space', 'Enter')) {
      if (menuSel === 0) { UP = {}; startStory(storyStartCh()); }
      else if (menuSel === 1) toMap();
      else { UP = {}; fromMap = false; mode = 'arcade'; newGame(); state = 'play'; }
    }
    pressed = {}; return;
  }
  if (state === 'map' || state === 'book') { exUpdate(); pressed = {}; return; }
  if (mode === 'story' && S.ex != null && state === 'play' && hit('Escape')) { leaveToHub(); pressed = {}; return; }
  if (mode === 'story' && state !== 'lose') {
    storyTick();
    if (state === 'menu' || state === 'map') { pressed = {}; return; }
    if (S.scene !== 'world' || (S.dlg && !S.dlg.auto) || S.freeze || S.conn) { beamSound(false); pressed = {}; return; }
  }
  if (mode === 'arcade' && state === 'play' && hit('Escape')) { leaveToHub(); pressed = {}; return; }
  if (state === 'lose') {
    endTimer++;
    if (endTimer > 60 && hit('Escape')) { leaveToHub(); pressed = {}; return; }
    if (endTimer > 60 && hit('Space', 'Enter', 'KeyR')) {
      if (mode === 'story') { state = 'play'; if (S.ex != null) startExpedition(S.ex); else gotoChapter(S.ch, true); pressed = {}; return; }
      newGame(); state = 'play';
    }
  }

  r.sucked = false;
  if (banner > 0) banner--;
  for (let i = spawnQ.length - 1; i >= 0; i--) if (--spawnQ[i] <= 0) { spawnQ.splice(i, 1); spawnTardi(); }

  // ---------------- ŁAZIK ----------------
  r.beamOn = false;
  if (state === 'play') {
    const CL = mode === 'story' && S.lock;            // sterowanie przejęte przez scenariusz
    const FB = CL || (mode === 'story' && S.fireBlock);
    if (mode === 'story' && !CL && hit('KeyE') && S.scanCd === 0) startScan();
    if (r.eaten) {
      // przytrzymany przy pysku: nie jedziesz, nie strzelasz – tylko wiertło cię uwolni
      r.holdT = 0; r.moving = false;
      r.face = (r.eaten.x + 51) > (r.x + 24) ? 1 : -1;
    } else {
      let dx = 0, dy = 0;
      if (CL) { dx = S.ax; dy = S.ay; }
      else {
        if (down('ArrowLeft', 'KeyA')) dx--;
        if (down('ArrowRight', 'KeyD')) dx++;
        if (down('ArrowUp', 'KeyW')) dy--;
        if (down('ArrowDown', 'KeyS')) dy++;
      }
      if (dx) r.face = Math.sign(dx);
      const v0 = UP.skis ? 2.15 : 1.6, sp = (dx && dy) ? v0 / Math.SQRT2 : v0;
      r.x += dx * sp + r.kx;
      r.y += dy * sp * 0.8 + r.ky;
      r.kx *= 0.85; r.ky *= 0.85;
      r.moving = !!(dx || dy);
      if (r.moving) r.dist += sp;

      // ---- LASER: krótkie stuknięcie = gruby pocisk, przytrzymanie = ciągła wiązka ----
      const held = !FB && down('Space', 'KeyJ');
      r.holdT = held ? r.holdT + 1 : 0;
      if (r.cd > 0) r.cd--;
      if (!FB && hit('Space', 'KeyJ') && r.cd === 0 && !r.lock && r.energy >= 8) {
        r.cd = 12; r.muzzle = 4; r.energy -= 8; r.idle = 0;
        const ox = rlx(r.x, r.face, 43);
        const lw = UP.chemcam ? 24 : 18, dmg = UP.chemcam ? 4 : 2;
        for (const dl of UP.stripes ? [0, -22, 22] : [0]) lasers.push({ x: r.face > 0 ? ox : ox - lw, y: lensY() + dl, lane: r.y + dl, w: lw, vx: 6.5 * r.face, dmg });
        SFX.bolt();
      }
      if (held && r.holdT > 16 && !r.lock && r.energy > 0) {
        r.beamOn = true; r.idle = 0;
        r.energy -= 0.8;
        if (r.energy <= 0) { r.energy = 0; r.lock = true; r.beamOn = false; SFX.empty(); popups.push({ x: r.x + 24, y: roverTop() - 8, txt: 'PUSTO!', life: 50 }); }
      } else {
        r.idle++;
        if (r.idle > (UP.devil ? 10 : 25)) r.energy = Math.min(100, r.energy + (UP.devil ? 0.9 : 0.45));
        if (r.lock && r.energy >= 35) { r.lock = false; SFX.ready(); }
      }
      if (r.muzzle > 0) r.muzzle--;
    }

      // ---- ramię robotyczne z wiertłem ----
      if (r.armCd > 0) r.armCd--;
      if (!CL && hit('KeyK', 'ShiftLeft', 'ShiftRight') && r.armT === 0 && r.armCd === 0) { r.armT = 1; r.armHit = false; SFX.arm(); }
      if (r.armT > 0) {
        r.armT++;
        if (r.eaten && r.armT === 6) {        // wiertło w pysk – uwolnienie!
          const t = r.eaten;
          r.armHit = true;
          shake = Math.max(shake, 5);
          burst(mouth(t).x, mouth(t).y, 16, ['#fff', '#f4d070', '#e6cfa6', '#c8201c'], 2.5, 20);
          SFX.clang();
          damageTardi(t, 1);
          release(t);
        }
        if (r.armT >= 4 && r.armT <= 16) {
          const tip = armTip();
          for (const s of stylets) if (Math.abs(s.x - tip.x) < 8 && Math.abs(s.y - tip.y) < 8) { s.dead = true; SFX.parry(); burst(s.x, s.y, 5, ['#fff', '#aaa'], 1.2, 12); }
          if (mode === 'story' && !r.armHit) for (const p of S.props) {
            if (p.done || (p.type !== 'sample' && p.type !== 'tube') || Math.abs(r.y - p.y) > LANE + 2 || Math.abs(tip.x - p.x) > 14) continue;
            r.armHit = true; p.done = true;
            burst(p.x, p.y - 8, 18, ['#ffffff', '#7ae8ff', '#f4d070', '#8c4224'], 2, 22);
            SFX.clang(); SFX.pickup();
            popups.push({ x: p.x, y: p.y - 30, txt: p.label || 'PRÓBKA POBRANA', life: 80 });
          }
          if (!r.armHit) for (const t of ts) {
            if (inactive(t) || Math.abs(r.y - t.y) > LANE + 2) continue;
            const touched = isBall(t) ? Math.abs(tip.x - ballC(t).x) < 28 : (tip.x > bodyX0(t) - 4 && tip.x < bodyX1(t) + 4);
            if (!touched) continue;
            r.armHit = true;
            shake = Math.max(shake, 3);
            burst(tip.x, tip.y, 10, ['#fff', '#f4d070', '#e6cfa6'], 2, 18);
            SFX.clang();
            if (isBall(t)) { t.vx = r.face * 3.5; t.rollDir = r.face; }
            else {
              damageTardi(t, 1);                 // wiertło głównie odpycha i przerywa atak
              t.x += r.face * 10;
              t.hurtRecent += 3;                 // rozdrażniony – szybko zwinie się w kulkę i ruszy na ciebie
              if (t.hp > 0 && t.state !== 'hold' && t.stunImm <= 0) { t.state = 'stun'; t.t = 25; t.stunImm = 180; }
            }
            break;
          }
        }
        if (r.armT > 22) { r.armT = 0; r.armCd = 70; }
      }
    if (r.inv > 0) r.inv--;
  } else r.holdT = 0;

  // zawieszenie rocker-bogie: koła pracują na nierównościach
  r.o = [0, 1, 2].map(i => (r.moving || (mode === 'story' && S.scroll)) ? Math.round(Math.sin(r.dist * 0.13 + i * 2.1) * 1.1) : r.o[i]);
  r.bodyOff = Math.round((r.o[0] + r.o[1] + r.o[2]) / 3);
  // głowica masztu rozgląda się, gdy nie strzelasz
  if (r.cd > 0 || r.beamOn || r.holdT > 0) { r.pan = 0; r.panT = 0; }
  else { r.panT++; r.pan = [0, 0, 0, 1, 2, 2, 1, 0][Math.floor(r.panT / 30) % 8]; }

  // ---------------- NIESPORCZAKI ----------------
  const rc = roverCenter();
  for (const t of ts) {
    if (t.flash > 0) t.flash--;
    if (t.stunImm > 0) t.stunImm--;
    t.hurtRecent = Math.max(0, t.hurtRecent - 0.012);
    const tcx = t.x + 51;
    const m = mouth(t);
    t.moving = false;

    if ((t.state === 'walk' || t.state === 'aim') && t.hurtRecent >= 5 && state === 'play') startCurl(t);

    switch (t.state) {
      case 'walk': {
        t.face = rc.x > tcx ? 1 : -1;
        const dx = rc.x - tcx, adx = Math.abs(dx);
        const sp = 0.4 + wave * 0.035;
        let mx = 0, my = 0;
        if (adx > 115 || !t.entered) mx = Math.sign(dx); else if (adx < 70) mx = -Math.sign(dx) * 0.6;
        if (Math.abs(r.y - t.y) > 3) my = Math.sign(r.y - t.y) * 0.7;
        t.x += mx * sp; t.y += my * sp;
        t.moving = !!(mx || my);
        if (t.entered && --t.cd <= 0 && state === 'play') {
          const dist = Math.hypot(rc.x - m.x, rc.y - m.y);
          const front = (rc.x - m.x) * t.face > 0;
          const hpF = t.hp / t.max;
          const canSuck = front && dist < 140 && Math.abs(r.y - t.y) < 30 && !r.eaten &&
                          !ts.some(o => o.state === 'suck' || o.state === 'hold');
          if (canSuck && Math.random() < 0.3) { t.state = 'suck'; t.t = 130; }
          else if (Math.random() < 0.35 + (1 - hpF) * 0.25) startCurl(t);   // częste kulkowanie
          else { t.state = 'aim'; t.t = 24; }
        }
        break;
      }
      case 'aim': {
        if (--t.t <= 0) {
          const a = Math.atan2(rc.y - m.y, rc.x - m.x);
          for (const da of [-0.12, 0.12]) stylets.push({ x: m.x, y: m.y, vx: Math.cos(a + da) * 2.0, vy: Math.sin(a + da) * 2.0 });
          SFX.stylet();
          t.state = 'walk'; t.cd = Math.max(80, 150 - wave * 8);
        }
        break;
      }
      case 'suck': {
        t.t--;
        if (frame % 2 === 0) {
          const ang = (t.face > 0 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.9, d = 30 + Math.random() * 110;
          const sx = m.x + Math.cos(ang) * d, sy = m.y + Math.sin(ang) * d;
          parts.push({ x: sx, y: sy, vx: (m.x - sx) / d * 3, vy: (m.y - sy) / d * 3, life: d / 3, c: Math.random() < 0.5 ? '#f6d9a8' : '#ffffff' });
        }
        if (frame % 8 === 0) SFX.suck();
        if (!r.eaten && state === 'play') {
          const dx = m.x - rc.x, dy = m.y - rc.y, d = Math.hypot(dx, dy) || 1;
          if ((rc.x - m.x) * t.face > -8 && d < 150) {
            const f = d < 30 ? 1.5 : 0.25 + 0.8 * (1 - d / 150);
            r.x += dx / d * f; r.y += dy / d * f * 0.8;
            r.sucked = true;
            if (d < 14) grab(t);
          }
        }
        if (t.state === 'suck' && t.t <= 0) { t.state = 'walk'; t.cd = 180; }
        break;
      }
      case 'hold': {   // trzyma łazika przy pysku i rani go, dopóki nie użyjesz wiertła
        t.t++;
        r.x = t.face > 0 ? m.x - 1 : m.x - 46;
        r.y = t.y;
        if (t.t % 60 === 0 && state === 'play') hurt(true);
        if (frame % 4 === 0) burst(m.x, m.y + (Math.random() - 0.5) * 8, 2, ['#e6cfa6', '#ffffff', '#c06438'], 1.2, 14);
        break;
      }
      case 'curl': if (--t.t <= 0) { t.state = 'roll'; t.t = 150; t.vx = 0; } break;
      case 'roll': {   // toczy się prosto po jednej linii
        t.t--;
        const c = ballC(t), maxV = 2.0 + wave * 0.1;
        t.vx = clamp(t.vx + t.rollDir * 0.06, -maxV, maxV);
        t.x += t.vx;
        t.rollDist += Math.abs(t.vx);
        if (t.x < -27) { t.x = -27; t.vx = Math.abs(t.vx) * 0.6; t.rollDir = 1; }
        if (t.x > W - 75) { t.x = W - 75; t.vx = -Math.abs(t.vx) * 0.6; t.rollDir = -1; }
        if (frame % 3 === 0 && Math.abs(t.vx) > 1) parts.push({ x: c.x - t.rollDir * 18, y: t.y - 2, vx: -t.vx * 0.3 + (Math.random() - 0.5), vy: -Math.random() * 0.8, life: 20, c: Math.random() < 0.5 ? '#c06438' : '#d88650' });
        if (frame % 12 === 0) SFX.rumble();
        if (state === 'play' && !r.eaten && Math.abs(r.y - t.y) < 16 && Math.abs(rc.x - c.x) < 36) {
          if (r.inv === 0) { hurt(false); r.kx = Math.sign(rc.x - c.x || 1) * 2; r.ky = Math.sign(r.y - t.y || 1) * 3; }
        }
        if (t.t <= 0) { t.state = 'uncurl'; t.t = 18; t.face = rc.x > c.x ? 1 : -1; }
        break;
      }
      case 'uncurl': if (--t.t <= 0) { t.state = 'walk'; t.cd = 70; t.hurtRecent = 0; } break;
      case 'emerge': {   // wyskakuje spod piasku
        t.t++;
        if (t.t < 44 && frame % 2 === 0) burst(t.x + 51 + (Math.random() - 0.5) * 90, t.y - 2, 4, ['#c06438', '#d88650', '#8a3c20', '#f0c8a0'], 2.6, 30);
        if (t.t === 20) shake = Math.max(shake, 7);
        if (t.t >= 50) { t.state = 'walk'; t.cd = 60; }
        break;
      }
      case 'flee': {     // pisk i ucieczka między skały
        t.face = 1; t.x += 2.4; t.moving = true;
        if (frame % 24 === 0) SFX.squeal();
        if (t.x > W + 12) t.gone = true;
        break;
      }
      case 'stun': if (--t.t <= 0) { t.state = 'walk'; t.cd = 60; } break;
      case 'die': {
        t.t--;
        if (frame % 4 === 0) burst(t.x + 51 + (Math.random() - 0.5) * 60, t.y - 25 + (Math.random() - 0.5) * 20, 4, ['#bc9a70', '#e6cfa6', '#7e5c3e'], 1.5, 25);
        break;
      }
    }
    if (!t.entered && t.x >= 0 && t.x <= W - TW) t.entered = true;
    if (t.entered && !isBall(t) && t.state !== 'flee') {
      if (t.x < 0) t.x = Math.min(0, t.x + 1.5);
      if (t.x > W - TW) t.x = Math.max(W - TW, t.x - 1.5);
    }
    t.y = clamp(t.y, GROUND_TOP, GROUND_BOT);
  }
  const alive = ts.filter(t => !inactive(t));
  for (let i = 0; i < alive.length; i++) for (let j = i + 1; j < alive.length; j++) {
    const a = alive[i], b = alive[j];
    if (Math.abs(a.x - b.x) < 80 && Math.abs(a.y - b.y) < 16) { const s = a.x < b.x ? -0.6 : 0.6; a.x += s; b.x -= s; }
  }
  if (state === 'play' && !r.eaten && !r.sucked) for (const t of alive) {
    if (isBall(t)) continue;
    if (Math.abs(r.y - t.y) < 12 && r.x + 44 > t.x + 8 && r.x + 4 < t.x + 92) r.x += Math.sign(rc.x - (t.x + 51)) * 1.2;
  }
  r.x = clamp(r.x, 0, mode === 'story' ? S.maxX : W - RW); r.y = clamp(r.y, mode === 'story' ? S.minY : GROUND_TOP, GROUND_BOT);

  droneTick();

  // ---------------- WIĄZKA CIĄGŁA ----------------
  if (r.beamOn) {
    const ox = rlx(r.x, r.face, 43), dir = r.face;
    let end = dir > 0 ? W + 4 : -4, target = null;
    for (const t of ts) {
      if (inactive(t) || Math.abs(r.y - t.y) > LANE) continue;
      const edge = isBall(t) ? ballC(t).x - dir * 23 : (dir > 0 ? bodyX0(t) : bodyX1(t));
      const far = isBall(t) ? ballC(t).x : (dir > 0 ? bodyX1(t) : bodyX0(t));
      if ((far - ox) * dir < 0) continue;
      const e = (edge - ox) * dir < 0 ? ox : edge;
      if ((e - ox) * dir < (end - ox) * dir) { end = e; target = t; }
    }
    if (mode === 'story') for (const p of S.props) {
      if (!shootable(p) || Math.abs(r.y - p.y) > LANE) continue;
      const edge = p.x - dir * p.hw, far = p.x + dir * p.hw;
      if ((far - ox) * dir < 0) continue;
      const e = (edge - ox) * dir < 0 ? ox : edge;
      if ((e - ox) * dir < (end - ox) * dir) { end = e; target = p; }
    }
    r.bx0 = ox; r.bx1 = end; r.by = lensY();
    for (const s of stylets) if (Math.abs(s.y - r.by) < 5 && (s.x - ox) * dir > 0 && (s.x - end) * dir < 0) { s.dead = true; burst(s.x, s.y, 3, ['#fff', '#7ae8ff'], 1, 10); }
    r.beamTick++;
    if (target && target.type) {          // rekwizyt fabularny (cel / głaz)
      if (target.type === 'target') hitTarget(target);
      else if (target.type === 'rock') smashRock(target);
      else if (target.type === 'crag') { if (frame % 2 === 0) burst(end, r.by, 2, ['#ffffff', '#ffe060'], 2, 12); if (r.beamTick % 8 === 0) SFX.ping(); }
      else {
        target.heat = 12; target.hy = r.by;
        if (frame % 2 === 0) burst(end, r.by, 3, ['#ffffff', '#ffb030', '#ff6a1a', '#e6966a'], 2.2, 16);
        if (r.beamTick % 3 === 0) { target.hp--; SFX.sizzle(); }
        if (target.hp <= 0) breakBoulder(target);
      }
    } else if (target) {
      if (frame % 2 === 0) burst(end, r.by, 2, ['#ffffff', '#7ae8ff', '#e6cfa6'], 2, 14);
      if (isBall(target)) { if (r.beamTick % 8 === 0) SFX.ping(); }
      else if (r.beamTick % (UP.chemcam ? 3 : 6) === 0) {
        target.hurtRecent += 0.4;
        damageTardi(target, 1);
        target.x += dir * 0.6;
        SFX.sizzle();
      }
    }
  }
  beamSound(r.beamOn && state === 'play', r.energy);

  // ---------------- POCISKI LASERA ----------------
  for (const l of lasers) {
    l.x += l.vx;
    const head = l.vx > 0 ? l.x + l.w : l.x;
    if (mode === 'story') for (const p of S.props) {
      if (!shootable(p) || Math.abs(l.lane - p.y) > LANE) continue;
      if (l.x < p.x + p.hw && l.x + l.w > p.x - p.hw) {
        l.dead = true;
        if (p.type === 'target') hitTarget(p);
        else if (p.type === 'rock') smashRock(p);
        else {
          burst(head, l.y, 10, ['#ffffff', '#ffe060', '#e6966a'], 2.4, 14); SFX.ping();
          if (p.type !== 'crag' && (!p.warnT || frame - p.warnT > 90)) { p.warnT = frame; popups.push({ x: p.x, y: p.y - (p.type === 'molt' ? 70 : 56), txt: p.type === 'molt' ? 'ELASTYCZNA! TNIJ!' : 'ZA TWARDY!', life: 60 }); }
        }
        break;
      }
    }
    if (l.dead) continue;
    for (const t of ts) {
      if (inactive(t) || Math.abs(l.lane - t.y) > LANE) continue;
      if (isBall(t)) {
        if (Math.abs(head - ballC(t).x) < 24) {
          l.dead = true;
          burst(head, l.y, 10, ['#ffffff', '#ffe060', '#7ae8ff'], 2.4, 14);
          SFX.ping();
          break;
        }
        continue;
      }
      if (l.x < bodyX1(t) && l.x + l.w > bodyX0(t)) {
        l.dead = true;
        t.hurtRecent += 1;
        damageTardi(t, l.dmg || 2);
        t.x += Math.sign(l.vx) * 2;
        burst(l.vx > 0 ? bodyX0(t) : bodyX1(t), l.y, 9, ['#7ae8ff', '#ffffff', '#e6cfa6'], 2, 18);
        SFX.hit();
        break;
      }
    }
  }
  lasers = lasers.filter(l => !l.dead && l.x > -30 && l.x < W + 30);

  // ---------------- STYLETY ----------------
  for (const s of stylets) {
    s.x += s.vx; s.y += s.vy;
    if (state === 'play' && !r.eaten && r.inv === 0 && inBox(s.x, s.y, { x: r.x + 4, y: roverTop() + 2, w: 40, h: 43 })) {
      s.dead = true; hurt(false);
    }
  }
  stylets = stylets.filter(s => !s.dead && s.x > -10 && s.x < W + 10 && s.y > -10 && s.y < H + 10);

  // ---------------- SERDUSZKA ----------------
  for (const p of pickups) {
    p.life--;
    if (state === 'play' && !r.eaten && Math.abs(rc.x - p.x) < 18 && Math.abs(r.y - p.y) < 14) {
      p.life = 0;
      if (r.hp < maxHp()) r.hp++;
      popups.push({ x: p.x, y: p.y - 20, txt: '+1', life: 50 });
      burst(p.x, p.y - 8, 10, ['#ff5060', '#ffb0b4', '#ffffff'], 1.5, 20);
      SFX.pickup();
    }
  }
  pickups = pickups.filter(p => p.life > 0);

  // ---------------- CZĄSTECZKI ----------------
  for (const q of parts) { q.x += q.vx; q.y += q.vy; q.vx *= 0.97; q.vy *= 0.97; q.life--; }
  parts = parts.filter(q => q.life > 0);
  for (const p of popups) { p.y -= 0.4; p.life--; }
  popups = popups.filter(p => p.life > 0);
  ts = ts.filter(t => !t.gone && (t.state !== 'die' || t.t > 0));

  if (mode === 'arcade' && state === 'play' && spawnQ.length === 0 && ts.length === 0) nextWave();

}

// czcionka ma za małe wielkie Ć Ł Ń Ó Ś Ź Ż – rysujemy literę bazową i dokładamy znak diakrytyczny
const PL_FIX = { 'Ć': ['C', 'a'], 'Ń': ['N', 'a'], 'Ó': ['O', 'a'], 'Ś': ['S', 'a'], 'Ź': ['Z', 'a'], 'Ż': ['Z', 'd'], 'Ł': ['L', 's'] };
function txt(s, x, y, col = '#fff', size = 8, align = 'center') {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  let marks = null;
  if (/[ĆŃÓŚŹŻŁ]/.test(s)) {
    marks = [];
    s = [...s].map((ch, i) => { const f = PL_FIX[ch]; if (f) { marks.push([i, f[1]]); return f[0]; } return ch; }).join('');
  }
  ctx.fillStyle = '#1a0804'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
  if (!marks) return;
  const u = size / 8, n = [...s].length;
  const x0 = Math.round(align === 'center' ? x - n * size / 2 : align === 'right' ? x - n * size : x);
  for (const [o, c] of [[1, '#1a0804'], [0, col]]) {
    ctx.fillStyle = c;
    for (const [i, k] of marks) {
      const cx = x0 + i * size + o, cy = Math.round(y) + o;
      if (k === 'a') { ctx.fillRect(cx + 4 * u, cy - 3 * u, 2 * u, u); ctx.fillRect(cx + 3 * u, cy - 2 * u, 2 * u, u); }
      else if (k === 'd') ctx.fillRect(cx + 3 * u, cy - 3 * u, 2 * u, 2 * u);
      else { ctx.fillRect(cx + 3 * u, cy + 2 * u, 2 * u, u); ctx.fillRect(cx + 4 * u, cy + u, 2 * u, u); }
    }
  }
}
function pcirc(cx, cy, rad, col) {
  ctx.fillStyle = col;
  for (let dy = -rad; dy <= rad; dy++) {
    const w = Math.round(Math.sqrt(rad * rad - dy * dy));
    ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function drawFlip(img, x, y, face, w = img.width, h = img.height) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  if (face > 0) ctx.drawImage(img, x, y, w, h);
  else { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); ctx.restore(); }
}
function shadow(cx, y, rx) {
  ctx.fillStyle = 'rgba(50,14,4,0.45)';
  ctx.fillRect(Math.round(cx - rx), Math.round(y), Math.round(rx * 2), 1);
  ctx.fillRect(Math.round(cx - rx * 0.8), Math.round(y) - 1, Math.round(rx * 1.6), 1);
  ctx.fillRect(Math.round(cx - rx * 0.8), Math.round(y) + 1, Math.round(rx * 1.6), 1);
}

// s = { o, dist, pan, bodyOff, muzzle, armE, beamOn }
function drawRover(x, y, face, s) {
  const top = y - 45;
  shadow(x + 24, y, 21);
  const wf = ((Math.floor(s.dist / 1.2) % WHEEL_N) + WHEEL_N) % WHEEL_N;
  composeRover(s.o, s.bodyOff, wf, s.pan);
  drawFlip(RC, x, top, face);
  const X = lx => Math.round(rlx(x, face, lx)), T = Math.round(top) + s.bodyOff;
  // ramię: bark -> łokieć -> nadgarstek z wieżyczką narzędzi
  const e = s.armE;
  const sh = [39, 24], el = [41 + 12 * e, 30 - 10 * e], wr = [44 + 32 * e, 29 - 3 * e];
  const P = p => [X(p[0]), T + Math.round(p[1])];
  drawLinks(ctx, [[P(sh), P(el)], [P(el), P(wr)]], M[6], M[4]);
  const [ex, ey] = P(el); joint(ctx, ex, ey, 1);
  const [sx, sy] = P(sh); joint(ctx, sx, sy, 1);
  const [wx, wy] = P(wr);
  const TC = s.armReady === false ? [M[1], M[2], M[3], M[3], M[4]] : GOLD;   // szara = wiertło się chłodzi
  ctx.fillStyle = LINE_R; ctx.fillRect(wx - 3, wy - 3, 7, 7);
  ctx.fillStyle = TC[3]; ctx.fillRect(wx - 2, wy - 2, 5, 5);
  ctx.fillStyle = TC[1]; ctx.fillRect(wx - 2, wy + 1, 5, 1); ctx.fillRect(face > 0 ? wx + 2 : wx - 2, wy - 2, 1, 5);
  ctx.fillStyle = TC[4]; ctx.fillRect(wx - 2, wy - 2, 2, 1);
  // wiertło
  const spin = (frame >> 1) & 1;
  for (let k = 3; k <= 6; k++) {
    ctx.fillStyle = LINE_R; ctx.fillRect(wx + face * k, wy - 1, 1, 3);
    ctx.fillStyle = (k + spin) & 1 ? M[6] : M[3]; ctx.fillRect(wx + face * k, wy, 1, 1);
  }
  // błysk soczewki lasera
  if (s.muzzle > 0 || s.beamOn) {

    pcirc(lx, ly, 3 + (frame & 1), 'rgba(120,230,255,0.5)');
    pcirc(lx, ly, 1, '#ffffff');
  }
}
function roverState() { return { o: r.o, dist: r.dist, pan: r.pan, bodyOff: r.bodyOff, muzzle: r.muzzle, armE: armExt(), beamOn: r.beamOn, armReady: r.armCd === 0 && r.armT === 0 }; }

// płonąca, fioletowo-pomarańczowa aura wokół niesporczaka
function drawAura(cx, cy, rx, ry, seed) {
  for (let i = 0; i < 20; i++) {
    const a = i / 20 * Math.PI * 2 + seed;
    const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;
    const ph = frame * 0.16 + i * 1.7 + seed;
    const hgt = 4 + Math.round((Math.sin(ph) + 1) * 3.5);
    ctx.fillStyle = i % 3 === 0 ? 'rgba(255,110,30,0.5)' : (i % 3 === 1 ? 'rgba(170,40,210,0.45)' : 'rgba(220,50,140,0.4)');
    for (let k = 0; k < hgt; k++) {
      const w = Math.max(1, Math.round((hgt - k) * 0.7));
      ctx.fillRect(Math.round(px - w / 2 + Math.sin(ph + k * 0.6) * 1.5), Math.round(py - k), w, 1);

function drawTardi(t) {
  const top = tTop(t);
  if (t.state === 'emerge') {
    const k = smooth(0, 1, t.t / 42);
    ctx.save(); ctx.beginPath(); ctx.rect(-20, -20, W + 40, Math.round(t.y) + 22); ctx.clip();
    drawFlip(tardiSpr((frame >> 2) & 3, true, false), t.x + ((frame & 1) ? 1 : -1), top + (1 - k) * (TH + 4), t.face);
    ctx.restore();

    for (let dy = 0; dy < 6; dy++) { ctx.fillStyle = dy < 2 ? '#d88650' : '#a04a26'; const hw = Math.round(mw * Math.sqrt(1 - dy / 6)); ctx.fillRect(Math.round(t.x + 51 - hw), Math.round(t.y) - 5 + dy, hw * 2, 1); }
    return;
  }
  if (isBall(t)) {
    const c = ballC(t);
    let p = 1;
    if (t.state === 'curl') p = 1 - t.t / 30;
    if (t.state === 'uncurl') p = t.t / 18;
    if (t.state === 'curl' || (t.state === 'roll' && t.t > 130)) {   // ostrzeżenie: linia toczenia
      ctx.fillStyle = (frame >> 2) & 1 ? 'rgba(255,70,40,0.65)' : 'rgba(255,200,80,0.5)';
      const start = c.x + t.rollDir * 26;
      for (let k = 0; k < 400; k += 8) {
        const lxp = start + t.rollDir * k;
        if (lxp < 0 || lxp > W) break;
        ctx.fillRect(Math.round(lxp), Math.round(t.y) - 1, 4, 2);
      }
    }
    if (p < 0.5) {
      const k = p * 2, w = TW * (1 - k * 0.55), h = TH * (1 - k * 0.3);
      shadow(c.x, t.y, w * 0.4);
      drawFlip(tardiSpr(0, false, false), c.x - w / 2, t.y + 1 - h, t.face, w, h);
    } else {
      const s = 0.7 + 0.3 * Math.min(1, (p - 0.5) * 2);
      const idx = Math.floor(t.rollDist / (2 * Math.PI * 23 / BALL_N)) % BALL_N;
      shadow(c.x, t.y, 20 * s);
      drawFlip(BALL[idx], c.x - 28 * s, c.y + 23 - 51 * s - 2 * (1 - s), t.rollDir, 56 * s, 56 * s);
      if ((t.state === 'curl' || (t.state === 'roll' && t.t > 130)) && (frame >> 2) & 1) txt('!', c.x, c.y - 40, '#ff3a20');
    }

  }
  const legs = t.moving ? (frame >> 3) & 3 : 0;
  let open = t.state === 'aim' || t.state === 'suck';
  let w = TW, h = TH, ox = 0, oy = 0;
  if (t.state === 'hold') { open = true; ox = (frame >> 1) & 1 ? 1 : -1; }
  if (t.state === 'suck') ox += (frame & 1) ? 1 : -1;
  if (t.state === 'stun') oy += (frame >> 2) & 1;
  if (t.state === 'die') { const k = t.t / 36; h = TH * (0.3 + 0.7 * k); w = TW * (1 + (1 - k) * 0.2); ox = -(w - TW) / 2; oy = TH - h; }
  shadow(t.x + 51, t.y, 40);
  const white = t.flash > 0 || (t.state === 'die' && (frame >> 1) & 1);
  drawFlip(tardiSpr(legs, open, white), t.x + ox, top + oy, t.face, w, h);
  if (t.state === 'die') return;
  if (t.state === 'stun') for (let k = 0; k < 3; k++) {
    const a = frame * 0.12 + k * 2.1;
    txt('*', t.x + (t.face > 0 ? 85 : 16) + Math.cos(a) * 12, top + 6 + Math.sin(a) * 3, '#ffe060');
  }
  if (t.hp < t.max) {
    const bx = Math.round(t.x + 31), by = Math.round(top) + 2;
    ctx.fillStyle = '#0a0606'; ctx.fillRect(bx - 1, by - 1, 42, 5);
    ctx.fillStyle = '#4a1010'; ctx.fillRect(bx, by, 40, 3);
    const f = t.hp / t.max;
    ctx.fillStyle = f > 0.5 ? '#7ad04a' : f > 0.25 ? '#f0a020' : '#ff3a3a';
    ctx.fillRect(bx, by, Math.round(40 * f), 3);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(bx, by, Math.round(40 * f), 1);
  }
}

function drawBolt(lx, ly, dir, lw = 18) {
  const x = Math.round(lx), y = Math.round(ly);
  const head = dir > 0 ? x + lw : x;
  ctx.fillStyle = 'rgba(120,230,255,0.35)'; ctx.fillRect(dir > 0 ? x - 10 : x + lw, y - 1, 10, 3);   // smuga

}
function drawLasers() {

function drawBeam() {
  if (!r.beamOn) return;

  drawBeamAt(r.bx0, r.bx1, r.by, r.face, weak);
}
function drawBeamAt(x0, x1, by, dir, weak = false) {
  const a = Math.round(Math.min(x0, x1)), w = Math.round(Math.abs(x1 - x0)), y = Math.round(by);
  const pulse = (frame >> 1) & 1;
  const th = weak ? 0 : 1;
  ctx.fillStyle = `rgba(80,220,255,${0.16 + pulse * 0.08})`; ctx.fillRect(a, y - 6 - th, w, 13 + th * 2);
  ctx.fillStyle = 'rgba(80,220,255,0.4)'; ctx.fillRect(a, y - 4 - th, w, 9 + th * 2);
  ctx.fillStyle = '#1aa8d8'; ctx.fillRect(a, y - 3, w, 7);
  ctx.fillStyle = '#7ae8ff'; ctx.fillRect(a, y - 2, w, 5);
  ctx.fillStyle = '#e8fdff'; ctx.fillRect(a, y - 1, w, 3);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(a, y, w, 1);
  for (let k = 0; k < w; k += 22) {   // przepływ energii
    const pos = (k + frame * 7) % Math.max(1, w);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(dir > 0 ? a + pos : a + w - pos - 4, y - 2, 4, 5);
  }
  pcirc(x1, y, 6 + pulse, 'rgba(160,240,255,0.5)');
  pcirc(x1, y, 3, '#ffffff');
}
function drawStylets() {

}
function drawParts() {

function drawHUD() {

// pilot – czarne włosy, niebieskie oczy, zwykła kurtka (bez hełmu)
function buildPilot() {
  const b = new Buf(32, 32);
  ellipsoid(b, 16, 36, 15.5, 11, JACKET);                                       // kurtka
  for (let y = 24; y <= 31; y++) { const w = 2 + Math.floor((y - 24) * 0.45); for (let x = 16 - w; x <= 16 + w; x++) b.set(x, y, pick(['#55595f', '#6e737b', '#8d929a'], 0.6 - (x - 16) * 0.06, x, y)); }
  for (let y = 23; y <= 31; y++) { const o = 3 + Math.floor((y - 23) * 0.5); for (const s of [-1, 1]) { b.set(16 + s * o, y, JACKET[4]); b.set(16 + s * (o + 1), y, JACKET[3]); } }   // kołnierz
  for (let y = 19; y <= 25; y++) for (let x = 13; x <= 19; x++) b.set(x, y, pick(SKIN, 0.34 - (x - 16) * 0.06 - (y < 22 ? 0.16 : 0), x, y));   // szyja
  ellipsoid(b, 8.6, 15, 1.7, 2.6, SKIN); ellipsoid(b, 23.4, 15, 1.7, 2.6, SKIN);
  b.set(8, 15, SKIN[2]); b.set(23, 15, SKIN[2]);
  for (let y = 6; y <= 24; y++) for (let x = 7; x <= 25; x++) {                  // twarz z węższą brodą
    const rx = y > 16 ? 7.2 - (y - 16) * 0.42 : 7.2;
    if (rx <= 0) continue;
    const nx = (x + 0.5 - 16) / rx, ny = (y + 0.5 - 15) / 9, d = nx * nx + ny * ny;
    if (d > 1) continue;
    const nz = Math.sqrt(1 - d);
    b.set(x, y, pick(SKIN, (nx * LX + ny * LY + nz * LZ) * 0.7 + 0.34, x, y));
  }
  for (let y = 19; y <= 23; y++) for (let x = 10; x <= 22; x++) {                 // lekki zarost
    const c = b.get(x, y), k = SKIN.indexOf(c);
    if (k > 1 && BAYER[y & 3][x & 3] < 0.32 && !(y >= 20 && y <= 21 && x >= 14 && x <= 18)) b.set(x, y, SKIN[k - 1]);
  }
  for (let y = 0; y <= 13; y++) for (let x = 5; x <= 27; x++) {                   // czarne włosy z grzywką zaczesaną w lewo
    const nx = (x + 0.5 - 16) / 9.6, ny = (y + 0.5 - 9) / 8.4;
    if (nx * nx + ny * ny > 1) continue;
    const fringe = 8 + ((x * 7) % 3 === 0 ? 1 : 0) + (x >= 9 && x <= 14 ? 1 : 0);
    if (y > fringe && !(Math.abs(nx) > 0.74 && y <= 13)) continue;
    const strand = (x + Math.floor(y * 0.7)) % 4 === 0 ? 0.28 : 0;
    b.set(x, y, pick(HAIR_BLACK, 0.5 - ny * 0.3 - nx * 0.25 + strand, x, y));
  }
  for (const [x, y] of [[11, 1], [14, 0], [18, 0], [21, 1]]) b.set(x, y, HAIR_BLACK[2]);
  for (const x of [11, 12, 13, 14, 18, 19, 20, 21]) b.set(x, 11, HAIR_BLACK[1]);  // brwi
  b.set(11, 12, SKIN[2]); b.set(21, 12, SKIN[2]);
  for (const x of [11, 12, 13, 14, 18, 19, 20, 21]) b.set(x, 12, '#2a1810');      // linia rzęs
  for (const [w0, i0, i1, w1] of [[11, 12, 13, 14], [18, 19, 20, 21]]) {          // niebieskie oczy
    b.set(w0, 13, '#ece6e0'); b.set(i0, 13, '#3aa8ff'); b.set(i1, 13, '#1a52b8'); b.set(w1, 13, '#ece6e0');
  }
  b.set(16, 14, SKIN[4]); b.set(16, 15, SKIN[3]); b.set(17, 15, SKIN[2]); b.set(16, 16, SKIN[4]);
  b.set(15, 17, SKIN[1]); b.set(17, 17, SKIN[1]);
  for (let x = 14; x <= 18; x++) b.set(x, 20, '#9a5244');                          // usta
  for (let x = 15; x <= 17; x++) b.set(x, 21, SKIN[3]);
  b.outline('#0a0604');
  return b.toCanvas();
}

function buildBackCieslak() {
  const b = new Buf(28, 34);
  for (let y = 22; y <= 33; y++) for (let x = 10; x <= 17; x++) b.set(x, y, pick(SKIN, 0.3, x, y));
  for (let y = 27; y <= 33; y++) for (let x = 7; x <= 20; x++) b.set(x, y, y < 30 ? '#e8e4dc' : SUIT[2]);

  for (let y = 0; y <= 24; y++) for (let x = 2; x <= 25; x++) {
    const nx = (x + 0.5 - 13.5) / 10, ny = (y + 0.5 - 13) / 12.5;
    if (nx * nx + ny * ny > 1) continue;
    const comb = Math.abs(((x - 13.5) / (0.7 + y / 30)) % 3) < 0.6;          // zaczesane do tyłu pasma
    b.set(x, y, pick(HAIR_BLACK, 0.55 - ny * 0.35 - Math.abs(nx) * 0.3 + (comb ? 0.25 : 0), x, y));
  }
  b.outline('#050407');
  return b.toCanvas();
}
function buildBackTurzynski() {
  const b = new Buf(30, 34);
  for (let y = 22; y <= 33; y++) for (let x = 11; x <= 18; x++) b.set(x, y, pick(SKIN, 0.3, x, y));
  for (let y = 28; y <= 33; y++) for (let x = 8; x <= 21; x++) b.set(x, y, y < 30 ? '#e8e4dc' : TWEED[2]);
  ellipsoid(b, 3, 16, 2, 3.2, SKIN); ellipsoid(b, 26, 16, 2, 3.2, SKIN);
  for (let y = 0; y <= 26; y++) for (let x = 2; x <= 27; x++) {          // gęste, lekko falowane włosy
    const nx = (x + 0.5 - 14.5) / 11, ny = (y + 0.5 - 13) / 12.5, ang = Math.atan2(ny, nx);
    const d = Math.hypot(nx, ny), lim = 1 + 0.045 * Math.sin(ang * 7);
    if (d > lim || (y > 22 && Math.abs(nx) > 0.55 + Math.sin(x * 1.1) * 0.08)) continue;
    const wave = Math.sin(y * 0.55 + Math.sin(x * 0.4) * 1.6);
    b.set(x, y, pick(HAIR_BROWN, 0.5 - ny * 0.3 - Math.abs(nx) * 0.25 + wave * 0.16, x, y));
  }
  b.outline('#0e0804');
  return b.toCanvas();
}

function wrap(s, n) {
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    if (line && line.length + 1 + w.length > n) { out.push(line); line = w; }
    else line = line ? line + ' ' + w : w;
  }
  if (line) out.push(line);
  return out;
}
function* wait(n) { for (let i = 0; i < n; i++) yield; }
function* until(f) { while (!f()) yield; }
function* waitKey() { yield; while (!hit('Space', 'Enter', 'KeyJ')) yield; pressed = {}; S.fireBlock = true; }
function* say(who, text) {
  const lines = wrap(text, 41);
  S.dlg = { who, lines, len: lines.join('').length, n: 0, pos: S.scene === 'world' ? 'top' : 'bottom' };
  yield;
  while (true) {
    if (hit('Space', 'Enter', 'KeyJ')) { if (S.dlg.n < S.dlg.len) S.dlg.n = S.dlg.len; else break; }
    yield;
  }
  S.dlg = null; S.fireBlock = true; pressed = {};
}
function* play(seq) {
  for (const x of seq) {
    if (typeof x === 'number') yield* wait(x);
    else if (typeof x === 'function') { const g = x(); if (g && typeof g.next === 'function') yield* g; }
    else yield* say(x[0], x[1]);
  }
}
function* fadeOut(n = 30) { S.freeze = true; for (let i = 1; i <= n; i++) { S.fade = i / n; yield; } }
function* fadeIn(n = 30) { S.freeze = true; for (let i = n - 1; i >= 0; i--) { S.fade = i / n; yield; } S.freeze = false; }
function* autoMove(tx, ty) {
  S.lock = true;
  while (true) {
    const dx = tx - r.x, dy = ty - r.y;
    S.ax = Math.abs(dx) > 2 ? Math.sign(dx) : 0; S.ay = Math.abs(dy) > 2 ? Math.sign(dy) : 0;
    if (!S.ax && !S.ay) break;
    yield;
  }
  S.ax = S.ay = 0;
}
function* oppDrive(tx, sp) {
  const o = S.opp;
  while (Math.abs(o.x - tx) > sp) {
    const d = Math.sign(tx - o.x);
    o.x += d * sp; o.face = d; o.dist += sp;
    const st = rs(o.dist, o.pan); o.o = st.o; o.bodyOff = st.bodyOff;
    if (S.t % 16 === 0) SFX.motor();
    yield;
  }
  o.x = tx;
}
function* shot(name, cap, dur, step) {
  S.scene = 'montage'; S.shot = name; S.cap = cap; S.t = 0; S.cine = {}; S.flash = 6; parts = []; SFX.cut();
  for (let i = 0; i < dur; i++) { if (step) step(i); yield; }
}

function canyonTick() {
  if (S.scene !== 'world' || state !== 'play' || S.freeze || (S.dlg && !S.dlg.auto)) return;
  const sp = S.scroll;
  S.bgx += sp; r.dist += sp;
  const o = S.opp;
  if (o) {                                   // Opportunity sama omija przeszkody
    const next = S.props.filter(p => p.type === 'crag' && !p.done && p.x > o.x - 20).sort((a, b) => a.x - b.x)[0];
    const best = next ? next.gap : o.y;           // jedzie prosto w przerwę najbliższej bramki
    if (Math.abs(best - o.y) > 1) o.y += Math.sign(best - o.y) * 1.6;
    o.dist += sp;
    o.pan = S.dlg && S.dlg.who === O ? 1 : 0;
    const st = rs(o.dist, o.pan); o.o = st.o; o.bodyOff = st.bodyOff;
  }
  for (const p of S.props) p.x -= sp;
  S.props = S.props.filter(p => p.x > -90);
  for (const p of pickups) p.x -= sp;
  pickups = pickups.filter(p => p.x > -20);
  if (S.spawning && --S.spawnT <= 0) { spawnGate(); S.spawnT = 165 + Math.random() * 45; }
  for (const p of S.props) {                 // zderzenie z przeszkodą
    if (p.done || !isObstacle(p) || r.eaten) continue;
    if (Math.abs(r.y - p.y) < 13 && r.x + 44 > p.x - p.hw && r.x + 4 < p.x + p.hw) {
      p.crashed = true;
      if (p.type === 'rock' || p.type === 'crag') smashRock(p); else breakBoulder(p);
      r.kx = -3;
      hurt(false);
    }
  }
  if (frame % 3 === 0) for (const q of [r, o]) if (q)
    parts.push({ x: q.x + 4 + Math.random() * 6, y: q.y - Math.random() * 3, vx: -sp - Math.random(), vy: -Math.random() * 0.5, life: 16 + Math.random() * 12, c: Math.random() < 0.5 ? '#c06438' : '#d88650' });

}

function* radio(who, text) {
  const lines = wrap(text, 41);
  S.dlg = { who, lines, len: lines.join('').length, n: 0, pos: 'top', auto: true };
  yield;
  let hold = 0;
  while (true) {
    const d = S.dlg;
    if (hit('Enter')) { if (d.n < d.len) d.n = d.len; else break; }
    if (d.n >= d.len && ++hold > 70 + d.len * 1.5) break;
    yield;
  }
  S.dlg = null;
}

  if (S.fireBlock && !down('Space', 'KeyJ')) S.fireBlock = false;

  if (S.scene === 'world') {
    if (S.scanCd > 0) S.scanCd--;
    if (S.scanT > 0 && ++S.scanT > 70) S.scanT = 0;
    for (const p of S.props) if (p.heat > 0) p.heat--;
  } else {
    tickParts();
    if (shake > 0) { shake *= 0.85; if (shake < 0.3) shake = 0; }
  }
  if (S.onTick) S.onTick();
  if (S.skippable && hit('Escape')) { gotoChapter(S.ch + 1); return; }

  for (const [fx, c] of [[-4, M[2]], [4, M[2]], [-8, M[4]], [8, M[4]]])
    for (const [px, py] of linePts(X + Math.sign(fx) * 2, Y - 5, X + fx, Y)) { ctx.fillStyle = c; ctx.fillRect(px, py, 1, 1); }
  ctx.fillStyle = LINE_R; ctx.fillRect(X - 4, Y - 11, 9, 7);
  ctx.fillStyle = GOLD[3]; ctx.fillRect(X - 3, Y - 10, 7, 5);
  ctx.fillStyle = BODY[5]; ctx.fillRect(X - 3, Y - 10, 7, 1);
  ctx.fillStyle = GOLD[1]; ctx.fillRect(X - 3, Y - 6, 7, 1);
  ctx.fillStyle = GLASS[1]; ctx.fillRect(X + 2, Y - 8, 1, 1);
  ctx.fillStyle = LINE_R; ctx.fillRect(X - 1, Y - 22, 3, 12);
  ctx.fillStyle = M[5]; ctx.fillRect(X, Y - 22, 1, 12);
  [[Y - 15, 0], [Y - 19, 1.3]].forEach(([ry, ph]) => {
    const L = spin ? Math.max(2, Math.round(Math.abs(Math.cos(frame * 0.7 + ph)) * 12)) : 12;
    if (spin) { ctx.fillStyle = 'rgba(220,230,240,0.22)'; ctx.fillRect(X - 12, ry, 25, 1); }
    ctx.fillStyle = LINE_R; ctx.fillRect(X - L - 1, ry - 1, L * 2 + 3, 3);
    ctx.fillStyle = M[5]; ctx.fillRect(X - L, ry, L * 2 + 1, 1);
  });
  ctx.fillStyle = LINE_R; ctx.fillRect(X - 5, Y - 26, 11, 4);
  ctx.fillStyle = SOLAR[2]; ctx.fillRect(X - 4, Y - 25, 9, 2);
  ctx.fillStyle = SOLAR[4]; ctx.fillRect(X - 4, Y - 25, 3, 1);
}

// elementy NPC do sortowania po głębokości
function npcItems(n) {
  const L = [];
  switch (n.id) {
    case 'propm':
      L.push({ y: n.ly, f: () => { shadow(n.lx, n.ly, 24); ctx.drawImage(MARS3, n.lx - 28, n.ly - 39); } });
      L.push({ y: n.y, f: () => drawPropM(n) }); break;
    case 'sojourner':
      L.push({ y: n.ly, f: () => { shadow(n.lx, n.ly, 40); ctx.drawImage(PATHFINDER, n.lx - 44, n.ly - 35); } });
      L.push({ y: n.y, f: () => drawSoj(n) }); break;
    case 'spirit': L.push({ y: n.y, f: () => drawSpirit(n) }); break;
    case 'curiosity': L.push({ y: n.y, f: () => drawMSL(n, false) }); break;
    case 'percy':
      L.push({ y: n.y, f: () => drawMSL(n, true) });
      L.push({ y: n.y + 1, f: () => drawHeli(n.hx, n.hy, true) }); break;
    case 'zhurong':
      L.push({ y: n.cy, f: () => { shadow(n.cx, n.cy, 4); ctx.drawImage(ZCAM, n.cx - 4, n.cy - 9); } });
      L.push({ y: n.y, f: () => drawZhurong(n) }); break;
    case 'opp': L.push({ y: n.y, f: () => drawOpp({ x: n.x - 24, y: n.y, face: n.face, pan: n.pan, o: [0, 0, 0], dist: 0, bodyOff: 0 }) }); break;
  }
  return L;
}

function portraitFrom(src, sx, sy, sw, sh, tintCol) {
  const k = 32 / sw, c = mkCanvas(32, 32, g => g.drawImage(src, sx, sy, sw, sh, 0, Math.round((32 - sh * k) / 2), 32, Math.round(sh * k)));
  return tintCol ? tint(c, tintCol) : c;
}
function headPortrait(head, tintCol) {
  return tint(mkCanvas(32, 32, g => {
    g.fillStyle = LINE_R; g.fillRect(13, 18, 6, 14);
    g.fillStyle = M[4]; g.fillRect(14, 18, 2, 14);
    g.fillStyle = M[2]; g.fillRect(16, 18, 2, 14);
    if (head.width === 18) g.drawImage(head, -2, 0, 36, 20); else g.drawImage(head, 2, 0, 28, 20);
  }), tintCol);
}

// ---------------- mapa Marsa ----------------
const MAPBG = (() => {
  const b = new Buf(W, H), n = noise2(71), n2 = noise2(72), R = rng(73);
  const MC = ['#3a160a', '#5a2410', '#74301a', '#8e4222', '#a8562e', '#bc6a3c', '#cc8050', '#dc9a6a'];
  const ICE = ['#b8a69a', '#d4c6ba', '#ece2d8', '#faf4ee'];
  const ell = (cx, cy, rx, ry, f) => { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) { const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2; if (d <= 1) f(x, y, d); } };
  const V = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = 0.56 + (n(x * 0.035, y * 0.05) - 0.5) * 0.5 + (n2(x * 0.14, y * 0.14) - 0.5) * 0.16;
    if (n(x * 0.02 + 5, y * 0.03 + 3) > 0.58) v -= 0.22;                   // ciemne obszary
    V[y * W + x] = v;
  }
  const add = (x, y, dv) => { if (x >= 0 && y >= 0 && x < W && y < H) V[y * W + x] += dv; };
  ell(171, 157, 24, 15, (x, y, d) => add(x, y, d > 0.8 ? 0.1 : 0.16));       // Hellas
  ell(337, 92, 12, 9, (x, y, d) => add(x, y, d > 0.7 ? 0.22 : d < 0.12 ? -0.25 : 0.1));   // Olympus Mons
  for (const [x, y] of [[352, 100], [360, 112], [367, 124]]) ell(x, y, 5, 4, (px, py, d) => add(px, py, d < 0.2 ? -0.2 : 0.14));
  for (let x = 6; x <= 58; x++) {                                           // Valles Marineris
    const y = Math.round(118 + Math.sin(x * 0.25) * 1.5 + (x - 30) * 0.06);
    for (let k = -1; k <= 1; k++) add(x, y + k, k === 0 ? -0.38 : -0.2);
    add(x, y + 2, 0.12);
  }
  for (let i = 0; i < 70; i++) {                                            // kratery
    const cx = R() * W, cy = 22 + R() * 180, rr = 1.5 + Math.pow(R(), 2.5) * 6;
    ell(cx, cy, rr, rr * 0.85, (x, y, d) => add(x, y, d > 0.6 ? 0.14 : -0.12));
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const lat = 90 - (y - 16) / 192 * 180;
    const cap = Math.abs(lat) - (lat > 0 ? 80 : 83) + (n(x * 0.08, y * 0.3) - 0.5) * 9;
    if (cap > 0) b.set(x, y, pick(ICE, 0.4 + cap * 0.05 + (V[y * W + x] - 0.5), x, y));
    else b.set(x, y, pick(MC, V[y * W + x], x, y));
  }
  for (let k = 0; k <= 12; k++) for (let y = 16; y < H; y += 2) { const x = Math.round(k * W / 12); if (x < W) b.set(x, y, '#c87a4a'); }   // siatka
  for (let k = 1; k < 6; k++) for (let x = 0; x < W; x += 2) b.set(x, 16 + k * 32, '#c87a4a');
  return b.toCanvas();
})();
const MAPROVER = (() => {
  const b = new Buf(11, 9);
  for (let x = 1; x <= 9; x++) { b.set(x, 3, BODY[5]); b.set(x, 4, BODY[3]); b.set(x, 5, GOLD[2]); }
  b.set(7, 1, BODY[5]); b.set(7, 2, BODY[4]); b.set(8, 1, GLASS[2]);
  for (const x of [2, 5, 8]) { b.set(x, 7, M[1]); b.set(x, 6, M[3]); }

})();

function exUpdate() {
  if (state === 'map') {
    let dx = 0, dy = 0;
    if (down('ArrowLeft', 'KeyA')) dx--;
    if (down('ArrowRight', 'KeyD')) dx++;
    if (down('ArrowUp', 'KeyW')) dy--;
    if (down('ArrowDown', 'KeyS')) dy++;
    if (dx || dy) {
      const sp = dx && dy ? 0.8 : 1.1;
      EX.x = clamp(EX.x + dx * sp, 6, W - 6); EX.y = clamp(EX.y + dy * sp, 22, 196);
      if (dx) EX.face = dx;
      const last = EX.trail[EX.trail.length - 1];
      if (!last || Math.hypot(last.x - EX.x, last.y - EX.y) > 4) { EX.trail.push({ x: EX.x, y: EX.y }); if (EX.trail.length > 70) EX.trail.shift(); }
    }
    mapSel = -1; let bd = 12;
    ROVERS.forEach((R, i) => { const d = Math.hypot(R.mx - EX.x, R.my - EX.y); if (d < bd) { bd = d; mapSel = i; } });
    if (hit('Space', 'Enter') && mapSel >= 0) {
      SFX.ready(); exSave();
      if (ROVERS[mapSel].story) { state = 'book'; bookSel = mapSel; bookPage = 0; }
      else startExpedition(mapSel);
      return;
    }
    if (hit('KeyB')) { state = 'book'; bookSel = Math.max(0, mapSel); bookPage = 0; SFX.arm(); }
    else if (hit('KeyF')) { exSave(); startUpgradedArcade(); }
    else if (hit('Escape')) { exSave(); toMenu(); }
    return;
  }
  // dziennik
  if (hit('ArrowUp', 'KeyW')) { bookSel = (bookSel + ROVERS.length - 1) % ROVERS.length; bookPage = 0; SFX.arm(); }
  if (hit('ArrowDown', 'KeyS')) { bookSel = (bookSel + 1) % ROVERS.length; bookPage = 0; SFX.arm(); }
  const pages = bookPages(ROVERS[bookSel]).length;
  if (hit('ArrowRight', 'KeyD') && bookPage < pages - 1) { bookPage++; SFX.type(); }
  if (hit('ArrowLeft', 'KeyA') && bookPage > 0) { bookPage--; SFX.type(); }
  if (hit('Escape', 'KeyB', 'Enter')) { state = 'map'; SFX.arm(); }
}

      txt('ODNALAZŁEŚ JĄ W TRYBIE FABULARNYM.', px + 8, py + 30, '#f4e6c6', 8, 'left');
      txt('JEJ HISTORIA JEST W DZIENNIKU.', px + 8, py + 41, '#f4e6c6', 8, 'left');
      if ((frame >> 4) & 1) txt('SPACJA - OTWÓRZ DZIENNIK', px + 8, py + 52, '#ffd27a', 8, 'left');
    } else {
      txt(done ? 'MISJA UKOŃCZONA' : 'MISJA: ' + R.goal, px + 8, py + 30, done ? '#7af0b0' : '#f4e6c6', 8, 'left');
      txt(done ? 'PREZENT: ' + UPG[R.up].name : 'PREZENT: ???', px + 8, py + 41, '#7ae8ff', 8, 'left');
      if ((frame >> 4) & 1) txt(done ? 'SPACJA - ODWIEDŹ PONOWNIE' : 'SPACJA - ROZPOCZNIJ MISJĘ', px + 8, py + 52, '#ffd27a', 8, 'left');
    }
  } else if ((frame >> 5) & 1) txt('PODJEDŹ DO ŁAZIKA NA MAPIE', W / 2, 186, '#fbf8f2');
  panel(4, 200, 104, 14); txt('B - DZIENNIK', 56, 203, '#ffd27a');
  panel(112, 200, 268, 14); txt('F - STRZELANKA Z ULEPSZENIAMI', 246, 203, '#ffd27a');
}

const BKC = offCanvas(150, 80), bkg = BKC.getContext('2d');
function bookPicture(R, cx, by) {           // podgląd łazika w dzienniku
  bkg.clearRect(0, 0, 150, 80);
  const n = Object.assign({ id: R.id, face: 1, pan: (frame >> 6) % 3 === 2 ? 2 : 0, t: frame, awake: true, dist: frame * 0.3, dust: 0.2, stuck: 0, moving: true }, R.npc || {});
  const small = R.id === 'propm' || R.id === 'sojourner';
  Object.assign(n, small ? { x: 46, y: 38 } : { x: 75, y: 76 });
  if (R.id === 'propm') { n.lx = 72; n.ly = 38; n.face = -1; n.x = 30; }
  if (R.id === 'sojourner') { n.x = 38; n.y = 34; n.moving = true; n.face = 1; }
  if (R.id === 'percy') { n.hx = 128; n.hy = 40 + Math.sin(frame * 0.05) * 3; n.x = 66; }
  if (R.id === 'zhurong') { n.cx = 132; n.cy = 76; n.x = 68; }
  if (R.id === 'opp') n.pan = (frame >> 6) % 3 === 2 ? 2 : 0;
  withCtx(bkg, () => { const L = npcItems(n).filter(it => R.id !== 'sojourner' || it.y === n.y); L.sort((a, b) => a.y - b.y).forEach(it => it.f()); });
  if (small) ctx.drawImage(BKC, 0, 0, 75, 40, cx - 75, by - 80, 150, 80);
  else ctx.drawImage(BKC, cx - 75, by - 80);
}
function drawBook() {
  ctx.fillStyle = '#0c0604'; ctx.fillRect(0, 0, W, H);
  panel(2, 2, W - 4, H - 4);
  ctx.fillStyle = '#3a1a10'; ctx.fillRect(116, 8, 1, H - 30);
  txt('DZIENNIK', 59, 10, '#ffd27a');
  ROVERS.forEach((R, i) => {
    const y = 30 + i * 18, sel = i === bookSel, un = unlocked(R);
    if (sel) { ctx.fillStyle = 'rgba(255,210,122,0.15)'; ctx.fillRect(6, y - 4, 108, 15); }
    txt(un ? R.name.slice(0, 12) : '??????', 10, y, sel ? '#ffd27a' : un ? '#e6cfa6' : '#6a5a4a', 8, 'left');
  });
  txt('ODKRYTE ' + ROVERS.filter(unlocked).length + '/' + ROVERS.length, 59, 164, '#a08870');
  const R = ROVERS[bookSel], pages = bookPages(R);
  if (!unlocked(R)) {
    txt('NIEZNANY ŁAZIK', 248, 70, '#a08870');
    txt('ODWIEDŹ GO NA MAPIE', 248, 90, '#6a5a4a');
    txt('I WYKONAJ JEGO MISJĘ', 248, 102, '#6a5a4a');
  } else {
    bookPicture(R, 304, 86);
    const col = SPK[R.who] ? SPK[R.who].col : '#fff';
    txt(R.name, 124, 14, col, 8, 'left');
    txt(R.place, 124, 28, '#e6cfa6', 8, 'left');
    txt(R.years, 124, 40, '#a08870', 8, 'left');
    if (R.id === 'percy') txt('+ INGENUITY', 124, 52, SPK[NPC_IN].col, 8, 'left');
    (pages[bookPage] || []).forEach((ln, i) => txt(ln, 124, 92 + i * 10, '#f4e6c6', 8, 'left'));
    if (pages.length > 1) txt((bookPage > 0 ? '< ' : '') + (bookPage + 1) + '/' + pages.length + (bookPage < pages.length - 1 ? ' >' : ''), 372, 184, (frame >> 4) & 1 ? '#ffd27a' : '#a08870', 8, 'right');
    if (R.up) txt('PREZENT: ' + UPG[R.up].name, 124, 184, '#7ae8ff', 8, 'left');
  }
  txt('STRZAŁKI - ŁAZIK I STRONA   ESC - MAPA', W / 2, 200, '#a08870');
}

// ---------------- dron Ingenuity (ulepszenie) ----------------
function droneTick() {
  if (!UP.drone || !r || state !== 'play') return;
  if (!drone || drone.owner !== r) drone = { owner: r, x: r.x + 24, y: roverTop() - 20, cd: 90, zap: 0, tx: 0, ty: 0 };
  const d = drone, gx = r.x + 24 - r.face * 20, gy = roverTop() - 14 + Math.sin(frame * 0.06) * 3;
  d.x += (gx - d.x) * 0.06; d.y += (gy - d.y) * 0.06;
  if (d.zap > 0) d.zap--;
  if (--d.cd <= 0) {
    let best = null, bd = 260;
    for (const t of ts) {
      if (inactive(t) || isBall(t) || !t.entered) continue;
      const dd = Math.hypot(t.x + 51 - d.x, tTop(t) + 30 - d.y);
      if (dd < bd) { bd = dd; best = t; }
    }
    if (best) {
      d.tx = best.x + 51 + (Math.random() - 0.5) * 30; d.ty = tTop(best) + 26 + (Math.random() - 0.5) * 10; d.zap = 8; d.cd = 110;
      damageTardi(best, 3); best.hurtRecent += 0.5;
      burst(d.tx, d.ty, 8, ['#ffffff', '#ff6a9a', '#ffd27a'], 1.8, 14);
      SFX.bolt();
    } else d.cd = 20;
  }
}
function drawDrone() {
  if (!UP.drone || state === 'menu') return;
  const blink = (frame >> 3) & 1;
  for (const t of ts) {                             // zwiad z góry: ostrzeżenia zamiast pasków życia
    if (inactive(t)) continue;
    const off = t.x + TW < 8 || t.x > W - 8;
    if (off || (t.x < 0 || t.x > W - TW) && !t.entered) {          // nadchodzi zza krawędzi ekranu
      const left = t.x + 51 < W / 2, y = clamp(Math.round(t.y - 34), HUD + 6, H - 24), x = left ? 2 : W - 16;
      ctx.fillStyle = blink ? '#ff3a3a' : '#a01818'; ctx.fillRect(x, y, 14, 18);
      ctx.fillStyle = '#1a0404'; ctx.fillRect(x + 1, y + 1, 12, 16);
      txt('!', x + 7, y + 2, blink ? '#ffd27a' : '#ff5a4a', 16);
      for (let k = 0; k < 4; k++) { ctx.fillStyle = '#ff3a3a'; ctx.fillRect(left ? x + 15 + k : x - 2 - k, y + 5 + k, 1, 8 - k * 2); }
      continue;
    }
    const danger = (t.state === 'aim' && t.t < 24) || t.state === 'curl' || (t.state === 'suck' && t.t > 110) || (t.state === 'walk' && t.entered && t.cd < 25);
    if (danger && blink) txt('!', Math.round(t.x + 51), Math.round(tTop(t)) - 14, t.state === 'walk' ? '#ffd27a' : '#ff3a3a', 16);
  }
  const d = drone;
  if (!d || state === 'lose') return;
  if (d.zap > 0) for (const [x, y] of linePts(Math.round(d.x), Math.round(d.y - 8), Math.round(d.tx), Math.round(d.ty))) {
    ctx.fillStyle = 'rgba(255,90,140,0.45)'; ctx.fillRect(x - 1, y - 1, 3, 3);
    ctx.fillStyle = '#ffe0ea'; ctx.fillRect(x, y, 1, 1);
  }
  drawHeli(d.x, d.y, true);
}

// ---------------- logo gry ----------------
function drawLogo(cx, y) {
  const T = 'TERRORIGRADES';
  txt(T, cx + 2, y + 3, '#2a0804', 24);                  // cień
  txt(T, cx, y + 1, '#8a2a12', 24);                      // spód liter
  txt(T, cx, y, '#f4e6c6', 24);
  ctx.save(); ctx.beginPath(); ctx.rect(0, y + 13, W, 11); ctx.clip();
  txt(T, cx, y, '#ff8a4a', 24);                          // dolna połowa liter w kolorze marsjańskiego pyłu
  ctx.restore();
  const w = 156;
  ctx.fillStyle = '#d88650'; ctx.fillRect(cx - w, y + 30, w * 2, 1);
  ctx.fillStyle = '#5a2410'; ctx.fillRect(cx - w, y + 31, w * 2, 1);
  for (let k = 0; k < 4; k++) { ctx.fillStyle = '#ffd27a'; ctx.fillRect(cx - k, y + 27 + k, k * 2 + 1, 1); ctx.fillRect(cx - k, y + 34 - k, k * 2 + 1, 1); }
}

// ---------------- nakładka: prezent ----------------
function exOverlay() {
  const g = S.gift;
  if (!g) return;
  g.t++;
  const u = UPG[g.up], y = 52;
  panel(W / 2 - 160, y, 320, 92);
  txt('PREZENT OD: ' + g.from, W / 2, y + 10, '#ffd27a');
  for (let i = 0; i < 10; i++) {
    const a = g.t * 0.05 + i * 0.63;
    ctx.fillStyle = i % 2 ? '#7ae8ff' : '#ffd27a';
    ctx.fillRect(Math.round(W / 2 + Math.cos(a) * 140), Math.round(y + 40 + Math.sin(a) * 18), 2, 2);
  }
  txt(u.name, W / 2, y + 30, '#ffffff', 16);
  txt(u.eff, W / 2, y + 56, '#7ae8ff');
  if (g.t > 30 && (frame >> 4) & 1) txt('SPACJA - DALEJ', W / 2, y + 74, '#e6cfa6');
}

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
